name: Build draft release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v0.8.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require matching existing tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git rev-parse --verify "refs/tags/$RELEASE_TAG"
          node scripts/check-version.mjs "$RELEASE_TAG"
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run release:local
      - name: Check ZIP interoperability
        run: |
          unzip -t artifacts/releases/*source.zip
          unzip -t artifacts/releases/*extension.zip
      - run: npm run release:verify
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: |
            artifacts/releases/*source.tar.gz
            artifacts/releases/*source.zip
            artifacts/releases/*extension.zip
            artifacts/releases/*.sha256
            artifacts/releases/SHA256SUMS.txt
            artifacts/releases/manifest.json
            artifacts/release-check.json
      - name: Create a draft prerelease for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node scripts/release-notes.mjs > artifacts/release-notes.md
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
            --title "Cocos Creator MCP $RELEASE_TAG (preview)" \
            --notes-file artifacts/release-notes.md \
            artifacts/releases/*source.tar.gz \
            artifacts/releases/*source.zip \
            artifacts/releases/*extension.zip \
            artifacts/releases/*.sha256 \
            artifacts/releases/SHA256SUMS.txt \
            artifacts/releases/manifest.json \
            artifacts/release-check.json
